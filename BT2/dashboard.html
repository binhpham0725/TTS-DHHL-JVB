<!DOCTYPE html>
<html class="light" lang="vi">

<head>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Đăng ký danh sách học - Student Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="dashboard.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap" rel="stylesheet"/>

<script>

tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        primary: "#2b6cee",
        "background-light": "#f6f6f8",
        "background-dark": "#101622"
      },
      fontFamily: {
        display: ["Inter"]
      },
      borderRadius: {
        DEFAULT: "1rem",
        lg: "2rem",
        xl: "3rem",
        full: "9999px"
      }
    }
  }
}

</script>

</head>

<body class="font-display liquid-bg min-h-screen text-slate-900">

<div class="relative flex flex-col w-full min-h-screen">
<header class="sticky top-0 z-50 px-6 py-4">
<div class="max-w-7xl mx-auto glass-panel rounded-xl px-6 py-3 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-3">
<div class="bg-primary p-2 rounded-lg flex items-center justify-center text-white">
<span class="material-symbols-outlined">school</span>
</div>
<div>
<h1 class="text-xl font-bold tracking-tight text-slate-900">
Đăng ký danh sách học
</h1>
<p class="text-[10px] uppercase tracking-widest text-primary font-semibold">
Student Enrollment System
</p>
</div>
</div>
<button id="logoutBtn"
class="px-5 py-2 bg-primary text-white rounded-full font-bold text-sm shadow-lg">
Logout
</button>
</div>
</header>
<main class="flex-1 w-full max-w-7xl mx-auto px-6 py-8 space-y-8">
<div class="grid lg:grid-cols-12 gap-8 items-start">
<section class="lg:col-span-5">
<div class="glass-panel p-8 rounded-xl shadow-xl space-y-6">
<h2 class="text-2xl font-bold text-slate-800">
Đăng ký học viên
</h2>
<form class="space-y-5" onsubmit="return false">
<div class="space-y-2">
<label>Họ và tên</label>
<input
id="name"
class="w-full h-12 px-4 rounded-xl form-input-glass outline-none"
type="text">
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label>Ngày sinh</label>
<input
id="dob"
class="w-full h-12 px-4 rounded-xl form-input-glass outline-none"
type="date">
</div>
<div class="space-y-2">
<label>Tuổi</label>
<input
id="age"
class="w-full h-12 px-4 rounded-xl form-input-glass outline-none"
type="number"
readonly>
</div>
</div>
<div class="space-y-2">
<label>Giới tính</label>
<div class="flex gap-2">
<label class="gender-btn">
<input type="radio" name="gender" value="Nam"> Nam
</label>
<label class="gender-btn">
<input type="radio" name="gender" value="Nữ"> Nữ
</label>
</div>
</div>
<div class="space-y-2">
<label>Email</label>
<input
id="email"
class="w-full h-12 px-4 rounded-xl form-input-glass outline-none"
type="email">
</div>
<div class="space-y-2">
<label>Địa chỉ</label>
<textarea
id="address"
class="w-full min-h-[100px] p-4 rounded-xl form-input-glass outline-none">
</textarea>
</div>
<div class="space-y-2">
<label>Khóa học</label>
<select
id="course"
class="w-full h-12 px-4 rounded-xl form-input-glass outline-none">
<option value="">Chọn khóa học</option>
<option>Web Development</option>
<option>Mobile App</option>
<option>AI Basic</option>
</select>
</div>
<button type="button" class="register-btn">
Đăng ký ngay
</button>
</form>
</div>
</section>
<section class="lg:col-span-7">
<div class="glass-panel rounded-xl shadow-xl overflow-hidden w-full">
<div class="flex justify-between items-center p-4 border-b">
<h3 class="font-semibold">
Danh sách học viên
</h3>
<span id="studentCount"
class="text-sm bg-primary text-white px-3 py-1 rounded-full">
0 học viên
</span>
</div>
<table class="w-full text-sm">
<thead>
<tr class="table-head">
<th>STT</th>
<th>Họ và tên</th>
<th>GT</th>
<th>Ngày sinh</th>
<th>Tuổi</th>
<th>Email</th>
<th>Địa chỉ</th>
<th></th>
</tr>
</thead>
<tbody id="studentTable"></tbody>
</table>
<div id="pagination"
class="flex justify-center gap-2 p-4">
</div>
</div>
</section>
</div>
</main>
</div>
<div class="bubble-container"></div>

<script src="dashboard.js"></script>

</body>
</html>
