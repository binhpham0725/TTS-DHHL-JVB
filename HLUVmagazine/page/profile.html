<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang cá nhân | Tạp chí ĐH Hoa Lư</title>
    <link rel="stylesheet" href="../css/profile.css" />
</head>
<body>
    <header class="site-header">
        <div class="site-nav">
            <a class="brand" href="index.html">Tạp chí ĐH Hoa Lư</a>
            <button class="menu-toggle" id="menu-toggle">☰</button>
            <nav class="nav-links" id="nav-links">
                <a href="index.html">Home</a>
                <a href="magazine.html">Magazine</a>
                <a href="category.html?id=0">Chuyên mục</a>
                <a href="search.html">Tìm kiếm</a>
            </nav>
            <div class="actions"></div>
        </div>
    </header>
    <main class="container">
        <section class="panel">
            <div class="user-info">
                <img id="avatar" src="https://i.pravatar.cc/120" alt="Avatar" />
                <div>
                    <h2 id="fullname">Người dùng</h2>
                    <p id="email" style="color:var(--muted);"></p>
                </div>
            </div>
            <button class="btn edit-profile-btn" id="edit-profile-btn">✏️ Chỉnh sửa</button>
            <div class="divider"></div>
            <div>
                <span class="chip">Bookmark <strong id="bookmark-count">0</strong></span>
                <span class="chip">Bài đăng <strong id="post-count">0</strong></span>
                <span class="chip">Đã đọc <strong id="read-count">0</strong></span>
            </div>
        </section>
        <section class="panel">
            <h3>Bài viết đã lưu (Bookmark)</h3>
            <div id="bookmark-list" class="story-grid"></div>
        </section>
        <section class="panel">
            <h3>Bài viết của bạn</h3>
            <div id="my-posts" class="story-grid"></div>
            <div class="divider"></div>
            <h3>Đăng bài mới</h3>
            <form id="post-form">
                <label>Tiêu đề</label>
                <input id="post-title" required style="width:100%;padding:.6rem;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:.6rem;" />
                <label>Chuyên mục</label>
                <select id="post-category" required>
                    <option value="">Chọn chuyên mục...</option>
                    <option value="Công nghệ">Công nghệ</option>
                    <option value="Đời sống">Đời sống</option>
                    <option value="Học tập">Học tập</option>
                    <option value="Giải trí">Giải trí</option>
                    <option value="Sự kiện">Sự kiện</option>
                </select>
                <label>Ảnh bài viết</label>
                <div class="image-input-group">
                    <label style="display:block;margin-bottom:.3rem;font-size:.85rem;color:var(--muted);">Tải lên từ thiết bị:</label>
                    <input id="post-image-file" type="file" accept="image/*" style="width:100%;padding:.4rem;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:.4rem;" />
                    <label style="display:block;margin-bottom:.3rem;font-size:.85rem;color:var(--muted);">Hoặc dán link ảnh:</label>
                    <input id="post-image-url" placeholder="https://example.com/image.jpg" style="width:100%;padding:.6rem;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:.4rem;" />
                    <img id="image-preview" class="image-preview" style="display:none;" />
                </div>
                <label>Nội dung</label>
                <textarea id="post-content" rows="5" required style="width:100%;padding:.6rem;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:.6rem;"></textarea>
                <button class="btn" type="submit">Đăng bài</button>
            </form>
        </section>
        <section class="footer-section">
            <h3 style="margin-top:0;">Tài khoản</h3>
            <p style="color:var(--muted);margin-bottom:1rem;">Bạn đã đăng nhập với email sẽ được hiển thị ở header</p>
            <button class="btn btn-logout" id="logout-btn">🚪 Đăng xuất</button>
        </section>
    </main>
    <div class="modal" id="edit-profile-modal">
        <div class="modal-content">
            <button class="btn-close" onclick="document.getElementById('edit-profile-modal').classList.remove('active')">✕</button>
            <h2>Chỉnh sửa hồ sơ</h2>
            <form id="edit-profile-form">
                <label>Tên hiển thị</label>
                <input id="edit-name" type="text" required />
                <label>Avatar URL</label>
                <input id="edit-avatar" type="url" placeholder="https://example.com/avatar.jpg" />
                <p style="font-size:.85rem;color:var(--muted);">Hoặc dùng avatar mặc định từ Gravatar bằng email:</p>
                <button type="button" class="btn" onclick="setGravatarAvatar()" style="background:#fb923c;margin-bottom:1rem;">📸 Dùng Gravatar</button>
                <button type="submit" class="btn">💾 Lưu thay đổi</button>
            </form>
        </div>
    </div>
    <script src="../js/profile.js"></script>
    <script src="hluv-header.js"></script>
</body>
</html>
