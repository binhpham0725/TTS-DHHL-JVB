<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Nhập thông tin cá nhân</h2>
        <div class="form-group">
            <label>Nhập họ và tên</label>
            <input type="text" id="name">
            <div class="error" id="nameError"></div>
        </div>

        <div class="form-group">
            <label>Ngày sinh</label>
            <input type="date" id="dob">        
        </div>

        <div class="form-group">
            <label>Tuổi</label>
            <input type="text" id="age" disabled>
        </div>

        <div>
            <label>Số CCCD</label>
            <input type="text" id="cccd" maxlength="12">
            <div class="error" id="cccdError"></div>
        </div>

        <div class="form-group">
            <label>Tỉnh</label>
            <select id="province"></select>
        </div>

        <div class="form-group">
            <label>Phường</label>
            <select id="ward"></select>
        </div>

        <div class="form-group">
            <label>Đường</label>
            <select id="street"></select>
        </div>

        <div class="form-group">
            <label>Số nhà</label>
            <input type="text" id="house">
            <div class="error" id="houseError"></div>
        </div>


        <div class="form group">
            <label>Địa chỉ cụ thể</label>
            <input type="text" id="address" disabled>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
