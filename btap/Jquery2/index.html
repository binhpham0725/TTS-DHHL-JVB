<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Caro Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>GAME CARO</h2>

    <div class="controls">
        <button onclick="showBoard()">Hiện bàn cờ</button>
        <button onclick="hideBoard()">Ẩn bàn cờ</button>
        <button onclick="startGame()">Start</button>
        <button onclick="clearBoard()">Clear</button>
        <button onclick="undoMove()">Undo</button>
    </div>

    <div id="board"></div>

    <script src="script.js"></script>
</body>
</html>
