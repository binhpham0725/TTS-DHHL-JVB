<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Homepage</title>
<link rel="stylesheet" href="home.css">
</head>

<!-- Body -->
<body>

<h2>Đăng ký danh sách học</h2>

<!-- form thông tin -->
<div>

<input id="name" placeholder="Họ và tên">

<select id="gender">
<option value="">Giới tính</option>
<option value="nam">Nam</option>
<option value="nu">Nữ</option>
</select>

<input id="age" type="number" placeholder="Tuổi">

<input id="email" placeholder="Email">

<input id="address" placeholder="Địa chỉ">

<!-- đăng ký -->
<button onclick="register()">Đăng ký</button>

<!-- đăng xuất -->
<button onclick="logout()">Logout</button>

</div>


<!-- pop-up thông báo -->
<p id="message"></p>


<!-- bảng danh sách -->
<table>

<thead>
<tr>
<th>STT</th>
<th>Họ tên</th>
<th>Giới tính</th>
<th>Tuổi</th>
<th>Email</th>
<th>Địa chỉ</th>
<th>Xóa</th>
</tr>
</thead>

<!-- dữ liệu thêm vào = JavaScript -->
<tbody id="tableBody"></tbody>

</table>


<!-- thông báo logout -->
<div id="logoutPopup">
<span>✅</span> Logout thành công, chuyển hướng về trang đăng nhập sau 3 giây...
<div id="logoutBar"></div>
</div>


<!-- liên kết JavaScript -->
<script src="home.js"></script>

</body>
</html>
