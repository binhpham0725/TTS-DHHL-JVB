<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login Page</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="container">
<div class="card">

<div class="tabs">
<button id="signinTab" class="active">Sign In</button>
<button id="signupTab">Sign Up</button>
</div>

<div class="forms-wrapper">

<!-- SIGN IN -->
<form id="signinForm" class="form active" novalidate>

<div class="input-box">
<input id="signinEmail" type="email" placeholder="Email" required>
</div>

<div class="input-box">
<input id="signinPassword" type="password" placeholder="Password" required>

<i class="fa-solid fa-eye" id="signinEyeOpen"></i>
<i class="fa-solid fa-eye-slash" id="signinEyeClosed"></i>
</div>

<label class="remember">
<input type="checkbox"> Remember me
</label>

<button type="submit" class="submit">Sign In →</button>

<div class="social">

<div class="icon">
<img src="images/google.svg">
</div>

<div class="icon">
<img src="images/facebook.svg">
</div>

<div class="icon">
<img src="images/twitter.svg">
</div>

<div class="icon">
<img src="images/github.svg">
</div>

</div>

</form>

<!-- SIGN UP -->
<form id="signupForm" class="form">

<div class="input-box">
<input type="text" placeholder="Username" required>
</div>

<div class="input-box">
<input type="email" placeholder="Email" required>
</div>

<div class="input-box date">
<input id="birthday" type="date" required>
<i class="fa-solid fa-cake-candles birthday-icon"></i>
</div>

<div class="input-box">
<input id="signupPassword" type="password" placeholder="Password" required>

<i class="fa-solid fa-eye" id="signupEyeOpen"></i>
<i class="fa-solid fa-eye-slash" id="signupEyeClosed"></i>
</div>

<div class="input-box">
<input id="confirmPassword" type="password" placeholder="Confirm Password" required>

<i class="fa-solid fa-eye" id="confirmEyeOpen"></i>
<i class="fa-solid fa-eye-slash" id="confirmEyeClosed"></i>
</div>

<button class="submit">Create Account →</button>

<div class="social">
<div class="icon">
<img src="images/google.svg">
</div>

<div class="icon">
<img src="images/facebook.svg">
</div>

<div class="icon">
<img src="images/twitter.svg">
</div>

<div class="icon">
<img src="images/github.svg">
</div>
</div>
</div>

</form>

</div>

</div>
</div>

<script src="script.js"></script>
</body>
</html>
