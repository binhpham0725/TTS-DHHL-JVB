<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Page</title>

<!-- main stylesheet cho layout và responsive login card -->
<link rel="stylesheet" href="style.css">

<!-- fontawesome icon dùng cho eye toggle password -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<!-- particles background canvas tạo hiệu ứng động phía sau -->
<canvas id="particlesCanvas"></canvas>

<!-- container giữ login card ở center màn hình -->
<div class="container">
  <div class="card">

    <!-- tab switch giữa signin và signup -->
    <div class="tabs">
      <button id="signinTab" class="active">Sign In</button>
      <button id="signupTab">Sign Up</button>
    </div>

    <!-- wrapper chứa hai form để animate chuyển đổi -->
    <div class="forms-wrapper">

      <!-- signin form xử lý đăng nhập user -->
      <form id="signinForm" class="form active" autocomplete="off" novalidate>

        <input type="text" style="display:none">

        <div class="input-box">
          <input id="signinEmail" type="email" name="signinEmail" autocomplete="off" placeholder="Email">
        </div>

        <div class="input-box">
          <input id="signinPassword" type="password" name="signinPassword" autocomplete="new-password" placeholder="Password">
          <i class="fa-solid fa-eye" id="signinEyeOpen"></i>
          <i class="fa-solid fa-eye-slash" id="signinEyeClosed"></i>
        </div>

        <label class="remember">
          <input type="checkbox" autocomplete="off"> Remember me
        </label>

        <button type="submit" class="submit">Sign In →</button>

        <!-- social login icon display (UI only chưa có logic) -->
        <div class="social">
          <div class="icon"><img src="../images/google.svg" alt="Google"></div>
          <div class="icon"><img src="../images/facebook.svg" alt="Facebook"></div>
          <div class="icon"><img src="../images/twitter.svg" alt="Twitter"></div>
          <div class="icon"><img src="../images/github.svg" alt="Github"></div>
        </div>
      </form>

      <!-- signup form xử lý tạo tài khoản mới -->
      <form id="signupForm" class="form" autocomplete="off">

        <input type="text" style="display:none">

        <div class="input-box">
          <input id="signupUsername" type="text" name="signupUsername" autocomplete="off" placeholder="Username">
        </div>

        <div class="input-box">
          <input id="signupEmail" type="email" name="signupEmail" autocomplete="off" placeholder="Email">
        </div>

        <div class="input-box date">
          <input id="birthday" type="date" name="birthday" autocomplete="off">
          <i class="fa-solid fa-cake-candles birthday-icon"></i>
        </div>

        <div class="input-box">
          <input id="signupPassword" type="password" name="signupPassword" autocomplete="new-password" placeholder="Password">
          <i class="fa-solid fa-eye" id="signupEyeOpen"></i>
          <i class="fa-solid fa-eye-slash" id="signupEyeClosed"></i>
        </div>

        <div class="input-box">
          <input id="confirmPassword" type="password" name="confirmPassword" autocomplete="new-password" placeholder="Confirm Password">
          <i class="fa-solid fa-eye" id="confirmEyeOpen"></i>
          <i class="fa-solid fa-eye-slash" id="confirmEyeClosed"></i>
        </div>

        <button class="submit">Create Account →</button>

        <!-- social login icon display -->
        <div class="social">
          <div class="icon"><img src="../images/google.svg" alt="Google"></div>
          <div class="icon"><img src="../images/facebook.svg" alt="Facebook"></div>
          <div class="icon"><img src="../images/twitter.svg" alt="Twitter"></div>
          <div class="icon"><img src="../images/github.svg" alt="Github"></div>
        </div>
      </form>

    </div>
  </div>
</div>

<!-- toast notification hiển thị feedback login signup -->
<div id="toast">
  <span id="toastIcon"></span>
  <span id="toastText"></span>
  <div id="toastBar"></div>
</div>

<!-- scripts xử lý animation form và particles background -->
<script src="script.js"></script>
<script src="particles.js"></script>

</body>
</html>
